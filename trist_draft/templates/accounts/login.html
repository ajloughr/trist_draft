<section class="min-vh-100 d-flex align-items-center justify-content-center" style="background: linear-gradient(135deg, #0f172a 0%, #1e293b 50%, #334155 100%);">
    <div class="container py-5">
      <div class="row justify-content-center">
        <div class="col-12 col-md-8 col-lg-5 col-xl-4">
          <div class="card shadow-lg border-0" style="border-radius: 1.25rem; background: rgba(255, 255, 255, 0.98);">
            <div class="card-body p-4 p-md-5 text-center">
              <div class="mb-4">
                <i class="fa-solid fa-football fa-3x mb-2" style="color: #3b82f6;"></i>
                <h3 class="fw-bold mb-1" style="color: #0f172a; font-size: 1.75rem;">TRIST Draft</h3>
                <p class="text-muted small">Sign in to your team account</p>
              </div>
              <form method='POST'> {% csrf_token %}
                {% if error %}
                    <div class="alert alert-danger rounded-3 text-start small mb-4" role="alert">
                        <i class="fa-solid fa-triangle-exclamation me-1"></i> {{error}}
                    </div>
                {% endif %}
                <div class="mb-3 text-start">
                    <label for="username" class="form-label small fw-semibold text-secondary">Username</label>
                    <input type="text" id="username" name='username' class="form-control form-control-lg rounded-3 fs-6" placeholder='Enter username' required />
                </div>
    
                <div class="mb-4 text-start">
                    <label for="password" class="form-label small fw-semibold text-secondary">Password</label>
                    <input type="password" id="password" name='password' class="form-control form-control-lg rounded-3 fs-6" placeholder='Enter password' required />
                </div>
    
                <button class="btn btn-primary btn-lg w-100 fw-bold rounded-3 shadow-sm py-2" style="background: #1e293b; border-color: #1e293b;" type="submit">
                    Sign In <i class="fa-solid fa-arrow-right-to-bracket ms-1"></i>
                </button>
              </form>
            </div>
          </div>
        </div>
      </div>
    </div>
</section>
  

{% endblock %}
