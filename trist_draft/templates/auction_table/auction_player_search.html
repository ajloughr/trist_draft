<div class="card mb-3 p-3 border-0 shadow-sm" id="player_selection_card" style="border-radius: 12px; background: #ffffff; z-index: 1;">
    <!-- Title Bar -->
    <div class="d-flex justify-content-between align-items-center mb-3">
        <span class="summary-card-title">Player Selection</span>
        <span id="rfa_header_title" class="badge bg-info text-dark fw-bold" style="display: none;">RFA Mode</span>
    </div>

    <!-- Bootstrap Nav Tabs for Search DB vs Manual Entry -->
    <ul class="nav nav-tabs border-bottom mb-3" id="player_selection_tab_list" role="tablist">
        <li class="nav-item" role="presentation">
            <button class="nav-link active fw-bold small text-dark" id="tab_search_db" data-bs-toggle="tab" data-bs-target="#pane_search_db" type="button" role="tab" aria-controls="pane_search_db" aria-selected="true">
                <i class="fa-solid fa-magnifying-glass me-1"></i> Database Search
            </button>
        </li>
        <li class="nav-item" role="presentation">
            <button class="nav-link fw-bold small text-dark" id="tab_manual_entry" data-bs-toggle="tab" data-bs-target="#pane_manual_entry" type="button" role="tab" aria-controls="pane_manual_entry" aria-selected="false">
                <i class="fa-solid fa-pen-to-square me-1"></i> Manual Entry
            </button>
        </li>
    </ul>

    <!-- UFA Action Buttons (Pass & Drop Out - Full Width) -->
    <div class="d-flex gap-2 mb-3 w-100" id="ufa_action_buttons_div">
        <button id="pass_player_selection" class="btn btn-warning flex-fill fw-bold py-2 man-tooltip" type="button" data-bs-toggle="man-tooltip" data-bs-placement="top" title="Pass on player selection. Selection will move to the next team." style="border-radius: 8px;">Pass Selection</button>
        <button id="drop_out_player_selection" class="btn btn-outline-danger flex-fill fw-bold py-2 man-tooltip" type="button" data-bs-toggle="man-tooltip" data-bs-placement="top" title="Drop out of player selection." style="border-radius: 8px;">
            <span data-bs-toggle="modal" data-bs-target="#drop_out_of_selection_confirmation_modal">Drop Out of Selection</span>
        </button>
    </div>

    <div class="tab-content mt-1" id="player_search_tab_content">
        <!-- Pane 1: Search Database -->
        <div class="tab-pane fade show active" id="pane_search_db" role="tabpanel" aria-labelledby="tab_search_db">
            <div id="player_search_value_div" style="display: none;">
                <form onsubmit="return false;">
                    <!-- Player Name (Primary Search Input) -->
                    <div class="mb-2">
                        <label class="form-label small fw-bold text-dark mb-1">Player Name</label>
                        <div class="input-group">
                            <span class="input-group-text bg-white border-end-0"><i class="fa-solid fa-magnifying-glass text-muted"></i></span>
                            <input type="text" id="player_search_value" class="form-control border-start-0 player-search-field" placeholder="Player Name">
                        </div>
                    </div>
                    <div class="mb-2">
                        <label class="form-label small fw-bold text-dark mb-1">Team</label>
                        <input type="text" id="player_search_value_team" class="form-control player-search-field" placeholder="NFL Team">
                    </div>
                    <div class="row g-2 mb-3">
                        <div class="col-6">
                            <label class="form-label small fw-bold text-dark mb-1">Position</label>
                            <input type="text" id="player_search_value_pos" class="form-control player-search-field" placeholder="Position">
                        </div>
                        <div class="col-6">
                            <label class="form-label small fw-bold text-dark mb-1">Bye</label>
                            <input type="text" id="player_search_value_bye" class="form-control player-search-field" placeholder="Bye">
                        </div>
                    </div>
                </form>
            </div>

            <!-- Search Results -->
            <div id="search_results_table_div" class="mt-2">
                <label class="form-label small fw-bold text-dark mb-1">Results</label>
                <div style="border-radius: 10px; border: 1px solid #e2e8f0; overflow-y: auto; max-height: 420px; min-height: 250px; background: #ffffff;">
                    <table class="table table-hover align-middle mb-0" id="search_results_table" style="display: none;">
                        <thead class="d-none">
                            <tr>
                                <th>Player</th>
                                <th>Team</th>
                                <th>Pos</th>
                                <th>Bye</th>
                                <th>Drafted By</th>
                                <th>Select</th>
                            </tr>
                        </thead>
                        <tbody>
                        </tbody>
                    </table>
                    <div class="text-center py-4 text-muted" id="no_players_found">
                        <p class="mb-0 fw-semibold text-secondary" id="no_players_found_text" style="font-size: 0.85rem;">Enter search criteria above...</p>
                    </div>
                </div>
            </div>
        </div>

        <!-- Pane 2: Manual Entry -->
        <div class="tab-pane fade" id="pane_manual_entry" role="tabpanel" aria-labelledby="tab_manual_entry">
            <div id="selected_player_div" style="display: none;">
                <form class="py-1">
                    <div class="mb-2">
                        <label class="form-label small fw-bold text-dark mb-1">Player Name</label>
                        <input type="text" id="selected_player_name" class="form-control" placeholder="Player Name">
                    </div>
                    <div class="mb-2">
                        <label class="form-label small fw-bold text-dark mb-1">Team</label>
                        <input type="text" id="selected_player_team" class="form-control" placeholder="NFL Team">
                    </div>
                    <div class="row g-2 mb-3">
                        <div class="col-6">
                            <label class="form-label small fw-bold text-dark mb-1">Position</label>
                            <input type="text" id="selected_player_position" class="form-control" placeholder="Position">
                        </div>
                        <div class="col-6">
                            <label class="form-label small fw-bold text-dark mb-1">Bye</label>
                            <input type="text" id="selected_player_bye" class="form-control" placeholder="Bye">
                        </div>
                    </div>
                    <button id="submit_selected_player" class="btn btn-success w-100 fw-bold py-2 man-tooltip" type="button" data-bs-toggle="man-tooltip" data-bs-placement="top" title="Submit the entered manual player for auction." style="border-radius: 8px;">
                        Submit Player
                    </button>
                </form>
            </div>
        </div>
    </div>

    <!-- RFA Selector Div (outside tabs for RFA mode) -->
    <div id="rfa_selector_div" class="mt-3" style="display: none;">
        <label class="form-label small fw-bold text-dark mb-2">Select Restricted Free Agent (RFA)</label>
        <form onsubmit="return false;">
            <select class="form-select mb-3" id="rfa_selector" aria-label="RFA Selection">
            </select>
            <button id="select_rfa_player" class="btn btn-success w-100 fw-bold py-2" type="button" onclick="rfa_player_selected()" style="border-radius: 8px;">
                Submit Player
            </button>
        </form>
    </div>
</div>


<script>
    //fix me?
    //var current_auction_type_display = $('#current_auction_type').val();
    //
    //if (current_auction_type_display == 'Rookie') {
    //    document.getElementById('admin_auction_type_selected_rookie').checked = true;
    //} else if (current_auction_type_display == 'Restricted Free Agent') {
    //    document.getElementById('admin_auction_type_selected_ufa').checked = true;
    //} else if (current_auction_type_display == 'Unrestricted Free Agent') {
    //    document.getElementById('admin_auction_type_selected_rfa').checked = true;
    //}

    console.log("Attempting to connect to websocket: " + window.location.host)
    var ws_scheme = window.location.protocol == "https:" ? "wss" : "ws";
    var socket = new WebSocket(ws_scheme + '://' + window.location.host + '/ws/auction_table/');
        
    socket.onmessage = function(e) {
        var data = JSON.parse(e.data);

        console.log("AS WS Data Received: " + data.type)
        //console.log(data);
        if (data.type == "player_search_results"){
            search_result_data = JSON.parse(data.search_result_data);
            searching_team = data.searching_team;
            aution_manager_data_parsed = JSON.parse(data.auction_manager_data);
            aution_manager_data_trimmed = aution_manager_data_parsed[0].fields
            //console.log("Search Result Data: " + JSON.stringify(search_result_data));
            update_search_results_table(search_result_data,searching_team,aution_manager_data_trimmed)
        } else if (data.type == "user_rfa_results"){
            user_rfa_results_data = JSON.parse(data.user_rfa_results_data);
            // console.log("RFA result Data: " + JSON.stringify(user_rfa_results_data));
            if(data.team_name == $("#current_auction_user_team").val()){
                update_rfa_select(user_rfa_results_data);
            }
            update_team_rfa_roster_table(data.team_name, user_rfa_results_data);
        }
        
    };

    function update_team_rfa_roster_table(team_name, rfa_data) {
        var user_draft_order = null;
        $("#roster_team_tab_contents .tab-pane").each(function() {
            if ($(this).attr("data-team-name") === team_name) {
                user_draft_order = $(this).attr("data-draft-order");
            }
        });

        if (!user_draft_order) return;

        var tbody = $("#rfa_tbody_" + user_draft_order);
        if (!tbody.length) return;

        var rows_html = "";
        if (!rfa_data || rfa_data.length === 0) {
            rows_html = '<tr><td colspan="5" class="text-center text-muted py-3"><em>No RFAs remaining.</em></td></tr>';
            $("#rfa_cnt_total_" + user_draft_order).text("0 Remaining");
        } else {
            $("#rfa_cnt_total_" + user_draft_order).text(rfa_data.length + " Remaining");
            for (var i = 0; i < rfa_data.length; i++) {
                var fields = rfa_data[i].fields || rfa_data[i];
                var pos = (fields.position || "").toUpperCase();
                var posBadgeClass = "bg-secondary text-white";
                if (pos === "QB") posBadgeClass = "bg-primary text-white";
                else if (pos === "RB") posBadgeClass = "bg-success text-white";
                else if (pos === "WR") posBadgeClass = "bg-info text-dark";
                else if (pos === "TE") posBadgeClass = "bg-warning text-dark";
                else if (pos === "K" || pos === "PK") posBadgeClass = "bg-secondary text-white";
                else if (pos === "DEF" || pos === "DST" || pos === "D/ST") posBadgeClass = "bg-dark text-white";

                rows_html += '<tr>' +
                    '<td>' + (i + 1) + '</td>' +
                    '<td><strong>' + (fields.full_name || '') + '</strong></td>' +
                    '<td><span class="badge ' + posBadgeClass + '">' + pos + '</span></td>' +
                    '<td>' + (fields.team || '-') + '</td>' +
                    '<td>' + (fields.bye || '-') + '</td>' +
                    '</tr>';
            }
        }
        tbody.html(rows_html);
    }

    function get_rfas_for_user(){
        console.log("Get RFAs request Submitted")
        socket.send(JSON.stringify({
            'get_rfas_for_user': true,
            'team_name': $("#current_auction_user_team").val(),
            // 'admin_bid_override': $("#admin_bid_override").is(":checked")
        }));

    }
    
    function update_rfa_select(rfa_data) {
        //this idea of deleting all options and rebuilding is not the most optimized
        //but it is much less likely to produce inaccurate lists than trying to add and remove individual elements
        var rfa_select_element = document.getElementById("rfa_selector");
        var select_options =  $("#rfa_selector option")
        //remove all old rfa options
        $(".form-select[id='rfa_selector'] option").each(function() {
            $(this).remove();
        });
        option_data_array = ["full_name", "team","position"]

        console.log("Rebuilding RFA List: " + rfa_data.length)

        // //TODO: remove all rows and redraw with display name headers

        if (rfa_data.length == 0) {
            console.log("No RFAs remaining")
            $("#rfa_selector").append('<option>No RFAs Remaining...</option>')
        } else {
            // document.getElementById("no_players_found").style.display = "none";
            console.log("Some RFAs exist")
        }

        for (var i = 0; i < rfa_data.length; i++) {
            //iterate through rows
            //console.log("Draft Order: " + new_table_data[i].fields.draft_order )

            var new_row_html = '<option>'
            
            new_row_html = new_row_html + rfa_data[i].fields[option_data_array[0]]

            for (var j = 1; j < option_data_array.length; j++) {
                //iterate through columns
                new_col_value = rfa_data[i].fields[option_data_array[j]]
                //console.log("    " + option_data_array[j] + ": " + new_col_value )
                new_row_html = new_row_html +  " | " + new_col_value

            }
            
            new_row_html = new_row_html + "</option>"

            $("#rfa_selector").append(new_row_html)

        }
    }

    function getPositionBadgeClass(pos) {
        var p = (pos || "").toUpperCase().trim();
        if (p === "QB") return "bg-primary text-white";
        if (p === "RB") return "bg-success text-white";
        if (p === "WR") return "bg-info text-dark";
        if (p === "TE") return "bg-warning text-dark";
        if (p === "K" || p === "PK") return "bg-secondary text-white";
        if (p === "DEF" || p === "DST" || p === "D/ST") return "bg-dark text-white";
        return "bg-primary text-white";
    }

    function update_search_results_table(player_search_results,searching_team,aution_manager_data_parsed) {
        //console.log("Received results for " + searching_team)
        if (searching_team != $("#current_auction_user_team").val()){
            console.log("Received results for " + searching_team + " which is not our team - " + $("#current_auction_user_team").val());
            return;
        }

        var search_result_table = document.getElementById("search_results_table");

        $("#search_results_table tbody").empty();


        table_columns_array = ["full_name", "team","position","bye","drafted_by"]

        console.log("Rebuilding Search Results: " + player_search_results.length)

        if (document.getElementById("search_results_table_div")) {
            document.getElementById("search_results_table_div").style.display = "block";
        }

        var allSearchFieldsEmpty = !($('#player_search_value').val() || '').trim() &&
                                   !($('#player_search_value_team').val() || '').trim() &&
                                   !($('#player_search_value_pos').val() || '').trim() &&
                                   !($('#player_search_value_bye').val() || '').trim();

        if (player_search_results.length == 0) {
            if (allSearchFieldsEmpty) {
                $("#no_players_found_text").text("Enter search criteria above...");
            } else {
                $("#no_players_found_text").text("No Players found...");
            }
            $("#no_players_found").show();
            $("#search_results_table").hide();
        } else {
            $("#no_players_found").hide();
            $("#search_results_table").show();
        }

        for (var i = 0; i < player_search_results.length; i++) {
            var fields = player_search_results[i].fields;
            var pName = fields["full_name"] || "";
            var pTeam = fields["team"] || "";
            var pPos = fields["position"] || "";
            var pBye = fields["bye"] || "";
            var pDraftedBy = fields["drafted_by"] || "";

            var isPlayerUpForAuction = aution_manager_data_trimmed.player_for_auction_name && aution_manager_data_trimmed.player_for_auction_name.trim() !== "" && aution_manager_data_trimmed.player_for_auction_name.trim() !== "None";
            var isMyTurnToSelect = (aution_manager_data_trimmed.active_bidder == parseInt($("#current_auction_user_draft_order").val()));

            var select_player_button = '';
            if (pDraftedBy && pDraftedBy !== "Undrafted") {
                select_player_button = '<button type="button" class="btn btn-secondary btn-sm fw-bold px-3 text-truncate d-inline-block opacity-75" disabled style="border-radius: 8px; font-size: 0.75rem; min-height: 31px; line-height: 1.5; max-width: 130px;" title="Drafted by ' + pDraftedBy + '">' + pDraftedBy + '</button>';
            } else if (searching_team.length == 0 || isPlayerUpForAuction || !isMyTurnToSelect) {
                select_player_button = '<button type="button" class="btn btn-success btn-sm fw-bold px-3 text-uppercase opacity-50" disabled style="border-radius: 8px; font-size: 0.75rem; min-height: 31px; line-height: 1.5; letter-spacing: 0.5px;">SELECT</button>';
            } else {
                select_player_button = '<button type="button" class="btn btn-success btn-sm fw-bold px-3 text-uppercase shadow-sm" onclick="show_player_select_confirmation_modal(' + i + ')" style="border-radius: 8px; font-size: 0.75rem; min-height: 31px; line-height: 1.5; letter-spacing: 0.5px;">SELECT</button>';
            }

            var posBadgeClass = getPositionBadgeClass(pPos);
            var cell0_html = '<td class="align-middle text-start py-2 ps-3">' +
                '<div class="fw-bold text-dark player-result-name" style="font-size: 0.95rem;">' + pName + '</div>' +
                '<div class="small text-muted" style="font-size: 0.78rem;">' + pTeam + (pPos ? ' <span class="badge ' + posBadgeClass + ' ms-1 px-1.5 py-0.5" style="font-size: 0.68rem;">' + pPos + '</span>' : '') + (pBye ? ' <span class="ms-1">· Bye ' + pBye + '</span>' : '') + '</div>' +
            '</td>';
            var cell1_html = '<td class="d-none">' + pTeam + '</td>';
            var cell2_html = '<td class="d-none">' + pPos + '</td>';
            var cell3_html = '<td class="d-none">' + pBye + '</td>';
            var cell4_html = '<td class="d-none">' + pDraftedBy + '</td>';
            var cell5_html = '<td class="align-middle text-end py-2 pe-3">' + select_player_button + '</td>';

            var new_row_html = '<tr class="align-middle border-bottom">' + cell0_html + cell1_html + cell2_html + cell3_html + cell4_html + cell5_html + '</tr>';
            $("#search_results_table tbody").append(new_row_html);
        }
    }

    $('.player-search-field').bind('keyup', function(e) {
        send_player_search();
    });

    function show_player_select_confirmation_modal(player_selected_row) {
        console.log("Showing player select confirm modal")
        var search_results_table = document.getElementById("search_results_table");

        var row = search_results_table.querySelector("tbody").rows[player_selected_row];
        if (row) {
            selected_player_name = $(row.cells[0]).find('.player-result-name').text().trim();
            selected_player_team = row.cells[1].textContent.trim();
            selected_player_position = row.cells[2].textContent.trim();
            
            $("#selected_player_name_confirm").text(selected_player_name);
            $("#selected_player_team_confirm").text(selected_player_team);
            $("#selected_player_position_confirm").text(selected_player_position);
        }

        var modalEl = document.getElementById('select_player_confirmation_modal');
        if (modalEl) {
            var modalInst = bootstrap.Modal.getOrCreateInstance(modalEl);
            modalInst.show();
        }
    }

    function send_player_search() {
        var player_search_text = $('#player_search_value').val();
        var player_search_text_team = $('#player_search_value_team').val();
        var player_search_text_pos = $('#player_search_value_pos').val();
        var player_search_text_bye = $('#player_search_value_bye').val();

        console.log("Search Text: " + player_search_text)
        socket.send(JSON.stringify({
            'player_search_text': player_search_text,
            'player_search_text_team': player_search_text_team,
            'player_search_text_pos': player_search_text_pos,
            'player_search_text_bye': player_search_text_bye,
            'searching_team': $("#current_auction_user_team").val()
        }));
    }

    function rfa_player_selected() {
        if (window.is_tour_active) return;

        var selected_rfa = $("#rfa_selector").val();
        console.log("Player Selected: " + selected_rfa)

        selected_rfa_as_list = selected_rfa.split(" | ")

        //$("#selected_player_name").val(selected_rfa_as_list[0])
        //$("#selected_player_team").val(selected_rfa_as_list[1])
        //$("#selected_player_position").val(selected_rfa_as_list[2])

        socket.send(JSON.stringify({
            'submitted_player_name': selected_rfa_as_list[0],
            'submitted_player_team': selected_rfa_as_list[1],
            'submitted_player_position': selected_rfa_as_list[2],
            'team_name': $("#current_auction_user_team").val(),
            'admin_bid_override': $("#admin_bid_override").is(":checked")
        }));

    };

    
    function search_player_selected(player_selected_row,is_rfa) {

        console.log("Player Selected: " + player_selected_row)

        var search_results_table = document.getElementById("search_results_table");

        $("#selected_player_name").val(search_results_table.rows[player_selected_row + 1].cells[0].textContent)
        $("#selected_player_team").val(search_results_table.rows[player_selected_row + 1].cells[1].textContent)
        $("#selected_player_position").val(search_results_table.rows[player_selected_row + 1].cells[2].textContent)
    };
    
    $(document).on('click', '#select_player_confirmed', function(e) {
        if (window.is_tour_active) {
            e.preventDefault();
            e.stopPropagation();
            return false;
        }
        var submitted_player_name = $('#selected_player_name_confirm').text();
        var submitted_player_team = $('#selected_player_team_confirm').text();
        var submitted_player_position = $('#selected_player_position_confirm').text();
    
        var modalEl = document.getElementById('select_player_confirmation_modal');
        if (modalEl) {
            var modalInst = bootstrap.Modal.getInstance(modalEl) || bootstrap.Modal.getOrCreateInstance(modalEl);
            modalInst.hide();
            $(modalEl).removeClass('show').css('display', 'none').attr('aria-hidden', 'true');
            $('.modal-backdrop').remove();
            document.body.classList.remove('modal-open');
            document.body.style.overflow = '';
            document.body.style.paddingRight = '';
        }
        submit_selected_player(submitted_player_name,submitted_player_team,submitted_player_position);
    });

    function submit_selected_player(submitted_player_name,submitted_player_team,submitted_player_position) {
        console.log("Submitted New Player for Auction: " + submitted_player_name)

        if(submitted_player_name && submitted_player_team && submitted_player_position) {
            
            $("#selected_player_name").val("")
            $("#selected_player_team").val("")
            $("#selected_player_position").val("")
            $("#player_search_value").val("")
            $("#player_search_value").trigger('keyup');
            
            socket.send(JSON.stringify({
                'submitted_player_name': submitted_player_name,
                'submitted_player_team': submitted_player_team,
                'submitted_player_position': submitted_player_position,
                'team_name': $("#current_auction_user_team").val(),
                'admin_bid_override': $("#admin_bid_override").is(":checked")
            }));
        } else {
            console.log("Invalid player data submitted...")
        }

    }

    $(document).on('click', '#submit_selected_player', function(e) {
        if (window.is_tour_active) {
            e.preventDefault();
            e.stopPropagation();
            return false;
        }
        var submitted_player_name = ($('#selected_player_name').val() || '').trim();
        var submitted_player_team = ($('#selected_player_team').val() || '').trim();
        var submitted_player_position = ($('#selected_player_position').val() || '').trim();

        if (!submitted_player_name) {
            alert("Please enter a player name.");
            return;
        }

        $("#selected_player_name_confirm").text(submitted_player_name);
        $("#selected_player_team_confirm").text(submitted_player_team || "-");
        $("#selected_player_position_confirm").text(submitted_player_position || "-");

        var modalEl = document.getElementById('select_player_confirmation_modal');
        if (modalEl) {
            var modalInst = bootstrap.Modal.getOrCreateInstance(modalEl);
            modalInst.show();
        }
    });

    $(document).on('click', '#drop_out_of_selection_confirm', function(e) {
        if (window.is_tour_active) {
            e.preventDefault();
            e.stopPropagation();
            return false;
        }
        console.log("Team Dropped out of Player Selection: " + $("#current_auction_user_team").val())

        socket.send(JSON.stringify({
            'drop_out_player_selection': true,
            'team_name': $("#current_auction_user_team").val(),
            'admin_bid_override': $("#admin_bid_override").is(":checked")
        }));
    });

    $(document).on('click', '#pass_player_selection', function(e) {
        if (window.is_tour_active) {
            e.preventDefault();
            e.stopPropagation();
            return false;
        }
