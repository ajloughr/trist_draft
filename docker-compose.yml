services:
  django-postgres:
    image: postgres@sha256:f1341c01408dc7278e9d365ed4f860cd3f87dd16b4464ac326fc0f422083a579
    container_name: django-postgres
    restart: unless-stopped
    ports:
      - "5434:5432"
    volumes:
      - /mnt/user/docker/trist_draft/django_postgres:/var/lib/postgresql/data
      - /mnt/user/docker/trist_draft/draft_data:/home/draft_data
    environment:
      - POSTGRES_DB=postgres
    #   - POSTGRES_USER=${POSTGRES_USER}
    #   - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
    env_file:
      - ./django.env
    labels:
      - "com.centurylinklabs.watchtower.enable=false"
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "postgres"]
      interval: 120s
      timeout: 10s
      retries: 5

  django:
    build: .
    command: python manage.py runserver 0.0.0.0:8000
    container_name: django
    restart: unless-stopped
    volumes:
      - /mnt/user/docker/trist_draft/trist_draft_prod:/code
      - /mnt/user/docker/trist_draft/draft_data:/code/draft_data
    ports:
      - "8000:8000"
    # environment:
    #   - POSTGRES_NAME=postgres
    #   - POSTGRES_PORT=5434
    #   - POSTGRES_USER=${POSTGRES_USER}
    #   - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
    depends_on:
      - django-postgres
      - redis
    env_file:
      - ./django.env
    labels:
      - "com.centurylinklabs.watchtower.enable=false"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000"]
      interval: 120s
      timeout: 10s
      retries: 5

  redis:
    image: redis:5
    container_name: django_redis
    restart: unless-stopped
    depends_on:
      - django-postgres
    ports:
     - "6379:6379"
    volumes:
      - /mnt/user/docker/trist_draft/django_redis:/var/lib/redis
      - /mnt/user/docker/trist_draft/django_redis/redis.conf:/usr/local/etc/redis/redis.conf
    labels:
      - "com.centurylinklabs.watchtower.enable=false"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 120s
      timeout: 10s
      retries: 5