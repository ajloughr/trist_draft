services:


###############################################################################

  npm:
    container_name: npm
    image: 'jc21/nginx-proxy-manager:latest'
    restart: always
    ports:
      - '80:80'
      - '81:81'
      - '443:443'
    environment:
      DB_MYSQL_HOST: "npm_db"
      DB_MYSQL_PORT: 3306
      DB_MYSQL_USER: "npm"
      DB_MYSQL_PASSWORD: "npm"
      DB_MYSQL_NAME: "npm"
    volumes:
      - /mnt/user/docker/npm/data:/data
      - /mnt/user/docker/npm/letsencrypt:/etc/letsencrypt
    networks:
      - default

###############################################################################

  npm_db:
    container_name: npm_db
    image: 'jc21/mariadb-aria:latest'
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: 'npm'
      MYSQL_DATABASE: 'npm'
      MYSQL_USER: 'npm'
      MYSQL_PASSWORD: 'npm'
    volumes:
      - /mnt/user/docker/npm_db/mysql:/var/lib/mysql
    networks:
      - default
      
###############################################################################

  portainer:
    image: portainer/portainer-ce:latest
    container_name: portainer
    restart: always
    command: -H unix:///var/run/docker.sock
    ports:
      - "9000:9000"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - /mnt/user/docker/portainer/data:/data
      - /mnt/user/docker/shared:/shared
    environment:
      - TZ=America/New_York
    networks:
      - default


############################################################################### 

  homeassistant:
    container_name: homeassistant
    restart: unless-stopped
    image: "ghcr.io/home-assistant/home-assistant:stable"
    #devices:
    #  - /dev/ttyUSB0:/dev/ttyUSB0
    #  - /dev/ttyUSB1:/dev/ttyUSB1
    #  - /dev/hidraw1:/dev/hidraw1
    #  - /dev/ttyACM0:/dev/ttyACM0
    # depends_on:
    #   - postgres
    volumes:
      - /mnt/user/docker/homeassistant:/config
      - /etc/localtime:/etc/localtime:ro
      - /run/dbus:/run/dbus:ro
    ports:
      - "8123:8123"
    privileged: true
    environment:
      - PUID=1000
      - PGID=100
      - TZ=America/New_York
    networks:
      - default
      
###############################################################################    

  mosquitto:
    image: eclipse-mosquitto
    container_name: mosquitto
    ports:
      - "1883:1883"
    volumes:
      - /mnt/user/docker/mosquitto/config:/mosquitto/config
      - /mnt/user/docker/mosquitto/mosquitto_data:/mosquitto/data
      - /mnt/user/docker/mosquitto/mosquitto_log:/mosquitto/log
    environment:
      - TZ=America/New_York
    restart: unless-stopped

###############################################################################

  node-red:
    container_name: node-red
    image: nodered/node-red:latest
    environment:
      - TZ=America/New_York
    ports:
      - "1880:1880"
    volumes:
      - /mnt/user/docker/node-red:/data

  # postgres:
    # container_name: postgres
    # image: postgres
    # environment:
      # - POSTGRES_DB=default_db
      # - POSTGRES_PASSWORD=191678Fglvvb4!
      # - POSTGRES_USER=admin
    # networks:
