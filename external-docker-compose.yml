###############################################################################

  nanit:
    image: indiefan/nanit
    container_name: nanit
    restart: unless-stopped
    ports:
      - "1935:1935"
    volumes:
      - /mnt/user/docker/nanit:/data
    environment:
      - NANIT_RTMP_ADDR=192.168.1.100:1935
      - NANIT_LOG_LEVEL=trace

###############################################################################

  pgadmin:
    container_name: pgadmin
    image: dpage/pgadmin4
    # links:
      # - postgres
    # depends_on:
      # - postgres
    environment:
      - PGADMIN_DEFAULT_EMAIL=super.seahawk2011@gmail.com
      - PGADMIN_DEFAULT_PASSWORD=191678Fglvvb4!
#      - PGADMIN_LISTEN_PORT=5050
#      - PGADMIN_LISTEN_ADDRESS=172.19.0.2
    volumes:
      - /mnt/user/docker/pgadmin:/root/.pgadmin
    ports:
      - "5050:80"
#    expose:
#      - 5050    
    networks:
      - default

###############################################################################


  guacamole:
    container_name: guacamole
    image: guacamole/guacamole
    restart: always
    depends_on:
      - guacd
      - postgres_guac
    environment:
      - GUACD_HOSTNAME=guacd
      - GUACD_PORT=4822
      - POSTGRESQL_HOSTNAME=192.168.1.100
      - POSTGRESQL_PORT=5433
      - POSTGRESQL_DATABASE=guacamole_db
      - POSTGRESQL_USER=guacamole_user
      - POSTGRESQL_PASSWORD=191678
    ports:
      - "8082:8080"
    volumes:
      - /mnt/user/docker/guacamole:/etc/guacamole-home:ro
    networks:
      - default

#-----------------------------------------------------------------------------#

  guacd:
    container_name: guacd
    image: guacamole/guacd
    restart: always
    environment:
      - GUACD_LOG_LEVEL=warning
    volumes:
      - /mnt/user/docker/guacd/drive:/drive:rw
      - /mnt/user/docker/guacd/record:/record:rw
    networks:
      - default


#-----------------------------------------------------------------------------#

  postgres_guac:
    container_name: postgres_guac
    image: postgres:14.6
    environment:
      - POSTGRES_DB=guacamole_db
      - POSTGRES_PASSWORD=191678Fglvvb4!
      - POSTGRES_USER=admin
#      - POSTGRES_HOST_AUTH_METHOD=md5
    networks:
      - default
    restart: always
    ports:
      - "5433:5432"
    volumes:
      - /mnt/user/docker/postgres_guac/init:/docker-entrypoint-initdb.d:ro
      - /mnt/user/docker/postgres_guac/data:/var/lib/postgresql/data:rw
      - /mnt/user/docker/postgres_guac/schema:/schema

