  netdata:
    container_name: netdata
    image: netdata/netdata
    hostname: netdata.alsquared.duckdns.org # set to fqdn of host
    ports:
      - 19999:19999
    cap_add:
      - SYS_PTRACE
    security_opt:
      - apparmor:unconfined
    volumes:
      - /mnt/user/docker/netdata/config:/etc/netdata
      - /mnt/user/docker/netdata/lib:/var/lib/netdata
      - /mnt/user/docker/netdata/cache:/var/cache/netdata
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - /etc/passwd:/host/etc/passwd:ro
      - /etc/group:/host/etc/group:ro
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /etc/os-release:/host/etc/os-release:ro
    restart: always
    networks:
      - default

